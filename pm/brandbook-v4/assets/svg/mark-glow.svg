  <stop offset="44%" stop-color="#FFB6E8"></stop><stop offset="66%" stop-color="#7EDBFF"></stop>
  <stop offset="85%" stop-color="#D6F0FF"></stop><stop offset="100%" stop-color="#A78BFF"></stop>
