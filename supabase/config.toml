# Supabase project config — `supabase init` generates this, we maintain manually.
# Local dev usage: `supabase start` / `supabase db reset` / `supabase migration up`

project_id = "story-engine"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Wave 2 i18n (2026-05-28): trilingual email templates (EN / 繁中 / 簡中
# stacked in one email — Supabase doesn't support per-locale routing).
# For local dev only; for prod copy HTML into Supabase Dashboard →
# Authentication → Email Templates (see supabase/templates/README.md).
[auth.email.template.magic_link]
subject = "Sign in to Kieio · 登入 Kieio"
content_path = "./templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your Kieio account · 確認 Kieio 帳戶"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Kieio password · 重設 Kieio 密碼"
content_path = "./templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm new email · 確認新 email"
content_path = "./templates/email_change.html"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
